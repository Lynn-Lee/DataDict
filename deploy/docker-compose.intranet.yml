name: datadict-intranet

# 内网单机测试部署。变量来自同目录的 .env（复制自 deploy.env.example）。
# 用法见 docs/DEPLOY.md。

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: datadict
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须设置 POSTGRES_PASSWORD}
      DATADICT_WEB_PASSWORD: ${DATADICT_WEB_PASSWORD:?必须设置 DATADICT_WEB_PASSWORD}
      DATADICT_COLLECTOR_PASSWORD: ${DATADICT_COLLECTOR_PASSWORD:?必须设置 DATADICT_COLLECTOR_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d datadict"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: datadict:intranet
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      ENV: staging
      DEBUG: "false"
      TZ: Asia/Shanghai
      # 迁移专用高权限连接，只在启动时使用；运行时走下面两个业务角色
      ALEMBIC_DB_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/datadict
      DB_URL_WEB: postgresql+asyncpg://datadict_web:${DATADICT_WEB_PASSWORD}@postgres:5432/datadict
      DB_URL_COLLECTOR: postgresql+asyncpg://datadict_collector:${DATADICT_COLLECTOR_PASSWORD}@postgres:5432/datadict
      REDIS_URL: redis://redis:6379/0
      CREDENTIAL_SECRET_KEY: ${CREDENTIAL_SECRET_KEY:?必须设置 CREDENTIAL_SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?必须设置 JWT_SECRET_KEY}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  pgdata:
  redisdata:
