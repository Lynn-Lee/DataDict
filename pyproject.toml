[project]
name = "datadict"
version = "0.1.0"
description = "DataDict 数据库元数据知识库"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "loguru>=0.7",
    "redis>=5.2",
    "cryptography>=43.0",
    "pyjwt>=2.9",
    "apscheduler>=3.11",
    # 采集器驱动：V0.1 只需 MySQL（PostgreSQL 复用 asyncpg）
    "pymysql>=1.1",
    # Excel 种子导入（T-S5：Web 上传 + 脚本）
    "openpyxl>=3.1",
    # FastAPI multipart 文件上传依赖
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
# V1.0 接入 Oracle / SQL Server 时启用，见 DEV-TASKS T20.1 / T20.2
collectors-full = [
    "oracledb>=2.5",
    "pymssql>=2.3",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ─────────────────────────── ruff ───────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "ASYNC",    # flake8-async
    "S",        # bandit
    "C4",       # comprehensions
    "BLE",      # 盲目 except Exception —— 采集与健康检查里要显式 noqa 才放行
    "RUF",
]
ignore = [
    "S101",  # assert：测试中大量使用
    "B008",  # FastAPI 的 Depends() 默认值是标准写法
    # 本项目注释与文档一律用中文，全角标点是有意为之，不是"歧义字符"
    "RUF001",  # 字符串中的全角标点
    "RUF002",  # docstring 中的全角标点
    "RUF003",  # 注释中的全角标点
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

# ─────────────────────────── mypy ───────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "asyncpg.*", "pymysql.*"]
ignore_missing_imports = true

# ─────────────────────────── pytest ───────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    # 见 DEV-TASKS §6 质量门禁，这两类测试不允许 skip
    "gate: CI 门禁测试，不允许 skip",
    "needs_db: 需要真实 PostgreSQL",
]
