name: datadict

services:
  postgres:
    # pgvector 官方镜像，内置 pgvector；pg_trgm 是 contrib，随 PostgreSQL 自带。
    # 见 PRD §5.4 与 §M8——两个扩展都在数据库侧，不能用纯净 postgres 镜像。
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: datadict
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Shanghai
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 首次启动时创建扩展与两个业务角色。生产授权以 deploy/grants.sql 为准。
      - ./deploy/init-local.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d datadict"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
